<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Finanzas Seguras - Sistema de Turnos</title>
    <style>
        :root {
            --tinta: #1d2b3a;
            --papel: #ffffff;
            --fondo: #f3f5f4;
            --acento: #14604f;
            --acento-oscuro: #0d4539;
            --borde: #d5dbd8;
            --error: #a32121;
            --advertencia: #8a5a00;
            --ok: #14604f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px 16px 48px;
            background: var(--fondo);
            color: var(--tinta);
            font-family: "Segoe UI", system-ui, sans-serif;
            line-height: 1.5;
        }

        main { max-width: 960px; margin: 0 auto; }

        h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.9rem; margin: 0 0 4px; }
        h2 { font-family: Georgia, "Times New Roman", serif; font-size: 1.25rem; margin: 0 0 12px; }
        .subtitulo { margin: 0 0 24px; color: #4d5b66; }

        .rejilla { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
        @media (max-width: 760px) { .rejilla { grid-template-columns: 1fr; } }

        section { background: var(--papel); border: 1px solid var(--borde); border-radius: 6px; padding: 20px; }
        .espacio-superior { margin-top: 20px; }

        label { display: block; font-weight: 600; margin-bottom: 4px; }

        input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--borde);
            border-radius: 4px;
            font-size: 1rem;
            margin-bottom: 14px;
            font-family: inherit;
        }

        input:focus, button:focus-visible { outline: 3px solid #8fc9bb; outline-offset: 1px; }

        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 4px;
            background: var(--acento);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: var(--acento-oscuro); }

        .mensaje { min-height: 1.5em; margin: 12px 0 0; font-weight: 600; }
        .mensaje.error { color: var(--error); }
        .mensaje.advertencia { color: var(--advertencia); }
        .mensaje.ok { color: var(--ok); }

        table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        th, td { padding: 8px 6px; border-bottom: 1px solid var(--borde); text-align: left; }
        .vacio { color: #6b7780; font-style: italic; }

        dl { margin: 0; }
        .fila-resultado { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--borde); }
        dt { font-weight: 400; }
        dd { margin: 0; font-weight: 600; text-align: right; }
        .fila-total { font-size: 1.15rem; border-bottom: 2px solid var(--tinta); }
        .fila-total dt, .fila-total dd { font-weight: 700; }

        .caja-atencion {
            background: #eef6f4;
            border-left: 4px solid var(--acento);
            padding: 12px;
            margin-bottom: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main>
        <h1>Banco "Finanzas Seguras"</h1>
        <p class="subtitulo">Sistema de Turnos en una Entidad Bancaria</p>

        <div class="rejilla">
            <!-- Columna izquierda: registro y cola de espera -->
            <div>
                <section>
                    <h2>Solicitud de turno</h2>

                    <label for="txt-cliente">Nombre del cliente</label>
                    <input type="text" id="txt-cliente" placeholder="Ej: Ana" autocomplete="off">

                    <button type="button" id="btn-asignar">Asignar turno</button>

                    <p class="mensaje" id="div-mensaje" role="status" aria-live="polite"></p>
                </section>

                <section class="espacio-superior">
                    <h2>Clientes en espera</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>N.º de Turno</th>
                                <th>Cliente</th>
                            </tr>
                        </thead>
                        <tbody id="tb-turnos"></tbody>
                    </table>
                    <button type="button" id="btn-atender">Atender siguiente</button>
                </section>
            </div>

            <!-- Columna derecha: ventanilla y estadísticas -->
            <section>
                <h2>Ventanilla de atención</h2>
                <div class="caja-atencion" id="txt-atencion">Ningún cliente en atención</div>

                <h2 class="espacio-superior">Estadísticas del día</h2>
                <dl>
                    <div class="fila-resultado"><dt>Turnos totales</dt><dd id="txt-totales">0</dd></div>
                    <div class="fila-resultado"><dt>Atendidos</dt><dd id="txt-atendidos">0</dd></div>
                    <div class="fila-resultado"><dt>Pendientes</dt><dd id="txt-pendientes">0</dd></div>
                    <div class="fila-resultado fila-total"><dt>Porcentaje atendido</dt><dd id="txt-porcentaje">0%</dd></div>
                </dl>

                <div class="espacio-superior">
                    <button type="button" id="btn-estadisticas">Ver estadísticas del día</button>
                </div>
                <p class="mensaje ok" id="div-cierre"></p>
            </section>
        </div>
    </main>

    <!-- Referencia al archivo JavaScript -->
    <script src="./src/app.js"></script>
</body>
</html>
