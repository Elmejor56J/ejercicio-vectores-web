<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajero Bancario Inteligente</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            padding: 30px;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
        }

        header {
            background-color: #12304a;
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #cbd5e1;
        }

        .resumen {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .tarjeta {
            background-color: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000010;
        }

        .tarjeta h3 {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .tarjeta p {
            font-size: 25px;
            font-weight: bold;
            color: #12304a;
        }

        .depositado {
            color: #16a34a !important;
        }

        .retirado {
            color: #dc2626 !important;
        }

        .contenido {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        .panel {
            background-color: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000010;
        }

        .panel h2 {
            color: #12304a;
            font-size: 19px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px 10px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f1f5f9;
            color: #475569;
            font-size: 13px;
        }

        td {
            color: #334155;
            font-size: 14px;
        }

        .sin-movimientos {
            text-align: center;
            color: #94a3b8;
            padding: 25px;
        }

        /* Barra de desplazamiento del historial */
        .tabla-contenedor {
            max-height: 250px;
            overflow-y: auto;
        }

        @media (max-width: 750px) {
            .resumen {
                grid-template-columns: 1fr;
            }

            .contenido {
                grid-template-columns: 1fr;
            }

            body {
                padding: 15px;
            }

            .panel {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <header>
            <h1>Cajero Bancario Inteligente</h1>
            <p>Simulador de depósitos y retiros bancarios</p>
        </header>

        <!-- Resumen de la cuenta -->
        <section class="resumen">

            <div class="tarjeta">
                <h3>Total depositado</h3>
                <p class="depositado">$ <span id="txt-depositado">0.00</span></p>
            </div>

            <div class="tarjeta">
                <h3>Total retirado</h3>
                <p class="retirado">$ <span id="txt-retirado">0.00</span></p>
            </div>

            <div class="tarjeta">
                <h3>Saldo disponible</h3>
                <p>$ <span id="txt-saldo">0.00</span></p>
            </div>

        </section>

        <!-- Registro e historial -->
        <section class="contenido">

            <div class="panel">

                <h2>Registrar movimiento</h2>

                <label for="select-operacion">Tipo de operación</label>
                <select id="select-operacion">
                    <option value="Depósito">Depósito</option>
                    <option value="Retiro">Retiro</option>
                </select>

                <label for="txt-monto">Monto ($)</label>
                <input type="number" id="txt-monto"
                    placeholder="Ingrese el monto" min="0.01" step="0.01">

                <button id="btn-registrar">Registrar operación</button>

            </div>

            <div class="panel">

                <h2>Historial de movimientos</h2>

                <!-- Contenedor con desplazamiento vertical -->
                <div class="tabla-contenedor">

                    <table>
                        <thead>
                            <tr>
                                <th>N.º</th>
                                <th>Operación</th>
                                <th>Monto</th>
                            </tr>
                        </thead>

                        <tbody id="tb-movimientos">
                            <tr>
                                <td colspan="3" class="sin-movimientos">
                                    No hay movimientos registrados
                                </td>
                            </tr>
                        </tbody>
                    </table>

                </div>

            </div>

        </section>

    </div>

    <script src="./src/app.js"></script>

</body>
</html>
