<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Pedidos e Inventario</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }

        h2, h3 {
            color: #333;
        }

        .contenedor {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 850px;
            margin: auto;
        }

        input {
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .contenedor-botones {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .btn-registrar {
            background-color: #1976D2;
        }

        .btn-registrar:hover {
            background-color: #0D47A1;
        }

        .btn-limpiar {
            background-color: #757575;
        }

        .btn-limpiar:hover {
            background-color: #424242;
        }

        button small {
            display: block;
            font-weight: normal;
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #1976D2;
            color: white;
        }

        .agotado {
            color: red;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .contenedor-botones {
                flex-direction: column;
            }

            input {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h2>Control de Pedidos e Inventario en un Restaurante</h2>

    <!-- Datos del pedido -->
    <h3>Registrar pedido</h3>

    <label>Nombre del plato:</label>
    <br><br>

    <input type="text" id="txt-plato"
        placeholder="Ingrese el nombre del plato">

    <!-- Botones del sistema -->
    <div class="contenedor-botones">

        <button id="btn-registrar" class="btn-registrar">
            REGISTRAR PEDIDO
            <small>Verificar el plato y descontar el inventario</small>
        </button>

        <button id="btn-limpiar" class="btn-limpiar">
            LIMPIAR CAMPO
            <small>Borrar el nombre ingresado</small>
        </button>

    </div>

    <!-- Tabla de pedidos realizados -->
    <h3>Pedidos realizados</h3>

    <table border="1">
        <thead>
            <tr>
                <th>N°</th>
                <th>Nombre del plato</th>
                <th>Estado</th>
            </tr>
        </thead>

        <tbody id="tb-pedidos">
        </tbody>
    </table>

    <!-- Tabla del inventario -->
    <h3>Inventario disponible</h3>

    <table border="1">
        <thead>
            <tr>
                <th>N°</th>
                <th>Nombre del plato</th>
                <th>Stock disponible</th>
                <th>Estado</th>
            </tr>
        </thead>

        <tbody id="tb-inventario">
        </tbody>
    </table>

    <!-- Lista de platos agotados -->
    <h3>Platos agotados</h3>

    <ul id="lista-agotados">
    </ul>

</div>

    <script src="./src/app.js"></script>

</body>
</html>
