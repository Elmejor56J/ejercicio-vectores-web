<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Turnos - Clínica</title>
</head>
<body>

    <h2>Sistema de Turnos con Prioridades en una Clínica</h2>

    <!-- Datos del paciente -->
    <label>Nombre del paciente:</label>
    <input type="text" id="txt-nombre">

    <br><br>

    <label>Prioridad:</label>
    <select id="select-prioridad">
        <option value="Alta">Alta</option>
        <option value="Media">Media</option>
        <option value="Baja">Baja</option>
    </select>

    <br><br>

<!-- Botones del sistema de turnos -->
<div class="contenedor-botones">

    <!-- Botón para registrar pacientes -->
    <button id="btn-agregar" class="btn-agregar">
        <strong>+ REGISTRAR PACIENTE</strong>
        <small>Agregar un nuevo paciente a la lista de turnos</small>
    </button>

    <!-- Botón para atender pacientes -->
    <button id="btn-atender" class="btn-atender">
        <strong>ATENDER PACIENTE</strong>
        <small>Atender primero a los pacientes con prioridad alta</small>
    </button>

</div>
<style>
/* Contenedor de los botones */
.contenedor-botones {
    display: flex;
    gap: 15px;
    margin-top: 20px;
    margin-bottom: 20px;
}

/* Diseño general de los botones */
.contenedor-botones button {
    padding: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    color: white;
    transition: 0.3s;
}

/* Botón registrar paciente */
.btn-agregar {
    background-color: #1976D2;
}

/* Efecto al pasar el mouse */
.btn-agregar:hover {
    background-color: #0D47A1;
    transform: scale(1.03);
}

/* Botón atender paciente */
.btn-atender {
    background-color: #2E7D32;
}

/* Efecto al pasar el mouse */
.btn-atender:hover {
    background-color: #1B5E20;
    transform: scale(1.03);
}

/* Texto principal */
.contenedor-botones strong {
    font-size: 15px;
}

/* Descripción de cada botón */
.contenedor-botones small {
    font-size: 11px;
}

/* Adaptación para celulares */
@media (max-width: 500px) {
    .contenedor-botones {
        flex-direction: column;
    }
}
</style>

    <h3>Paciente que esta siendo atendido:</h3>
    <p id="txt-atendiendo">Ninguno</p>

    <h3>Lista de turnos pendientes:</h3>

    <table border="1">
        <thead>
            <tr>
                <th>N°</th>
                <th>Nombre</th>
                <th>Prioridad</th>
            </tr>
        </thead>
        <tbody id="tb-turnos">
        </tbody>
    </table>

    <script src="./src/app.js"></script>
</body>
</html>
